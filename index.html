<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Food Planner</title>
    <meta property="og:title" content="Food Planner" />
    <meta
      property="og:description"
      content="A recipe or a menu shared with you · Seninle paylaşılan bir tarif ya da menü · Een recept of menu voor jou"
    />
    <meta name="theme-color" content="#FBF4E9" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: #fbf4e9;
        --surface: #fffdf8;
        --surface-alt: #f5eadb;
        --separator: #eadbc8;
        --text: #2b1d14;
        --muted: #7a6656;
        --primary: #c4532e;
        --on-primary: #ffffff;
        --accent: #6e8b3d;
        --accent-text: #a8431f;
        --tint: #f3d9c6;
        --on-tint: #7e3015;
        --olive: #e4e7cf;
        --on-olive: #3f4a18;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1b1410;
          --surface: #271d17;
          --surface-alt: #33271f;
          --separator: #3e3028;
          --text: #f7eee4;
          --muted: #c2ae9c;
          --primary: #e06a43;
          --on-primary: #1b1410;
          --accent: #9bb866;
          --accent-text: #f08b66;
          --tint: #4a2c20;
          --on-tint: #f5b9a1;
          --olive: #353a22;
          --on-olive: #cfd9a6;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font:
          17px/1.45 "DM Sans",
          system-ui,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 20px 16px 200px;
        display: grid;
        gap: 22px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.4px;
      }
      .hero {
        background: var(--tint);
        border-radius: 28px;
        padding: 22px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .hero > div {
        flex: 1;
        min-width: 0;
      }
      .caption {
        color: var(--on-tint);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: 28px;
        line-height: 1.15;
        margin: 6px 0 0;
        overflow-wrap: anywhere;
      }
      h2 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: 20px;
        margin: 0 4px 10px;
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .fact {
        background: var(--surface);
        border-radius: 999px;
        padding: 7px 13px;
        font-weight: 600;
        font-size: 14px;
      }
      .muted {
        color: var(--muted);
      }
      .card {
        background: var(--surface);
        border-radius: 22px;
        overflow: hidden;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .card li {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 13px 18px;
      }
      .card li + li {
        border-top: 1px solid var(--separator);
      }
      .bullet {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        margin-top: 10px;
        flex: none;
      }
      .number {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--primary);
        color: var(--on-primary);
        font-weight: 700;
        font-size: 15px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .grow {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .pill {
        display: inline-block;
        margin-top: 6px;
        border-radius: 10px;
        padding: 3px 8px;
        font-weight: 700;
        font-size: 12px;
        background: var(--surface-alt);
        color: var(--muted);
      }
      .pill.passive {
        background: var(--olive);
        color: var(--on-olive);
      }
      .when {
        color: var(--muted);
        font-weight: 600;
        font-size: 14px;
        white-space: nowrap;
      }
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--background);
        padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
        box-shadow: 0 -8px 24px rgba(43, 29, 20, 0.08);
      }
      .bar > div {
        max-width: 560px;
        margin: 0 auto;
        display: grid;
        gap: 8px;
      }
      .button {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 54px;
        border-radius: 18px;
        background: var(--primary);
        color: var(--on-primary);
        font-weight: 700;
        font-size: 17px;
        text-decoration: none;
      }
      .note {
        text-align: center;
        font-size: 14px;
        color: var(--muted);
        margin: 0;
      }
      .center {
        text-align: center;
        padding: 40px 8px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main id="page">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 11h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z" fill="#C4532E" />
          <rect x="2.5" y="9" width="19" height="2.4" rx="1.2" fill="#2B1D14" />
          <path
            d="M9 3.5c1 1.2-1 2 0 3.2M13 3.5c1 1.2-1 2 0 3.2"
            stroke="#6E8B3D"
            stroke-width="1.6"
            fill="none"
            stroke-linecap="round"
          />
        </svg>
        FOOD PLANNER
      </div>
      <p class="center muted" id="status"></p>
    </main>
    <div class="bar" id="bar" hidden>
      <div>
        <a class="button" id="open" href="#"></a>
        <p class="note" id="note"></p>
      </div>
    </div>

    <script>
      // Shows a recipe or a menu someone shared from the Food Planner app and hands it to the
      // app. Reads the share through the get_share function, which anyone with the link may call
      // (the key below is the app's public key). Text is only ever set as text, never as HTML.
      const SUPABASE_URL = "https://xfwhpciavuzoxgktilwz.supabase.co";
      const SUPABASE_KEY = "sb_publishable_BpURnDwlO7xjbMz1E3Fcsg_7V5YXpfX";
      const ANDROID_PACKAGE = "com.rifatcakir.foodplanner";

      const STRINGS = {
        tr: {
          loading: "Yükleniyor…",
          sharedBy: (name) => `${name} paylaştı`,
          shared: "Seninle paylaşıldı",
          ingredients: "Malzemeler",
          steps: "Hazırlanışı",
          servings: (n) => `${n} kişilik`,
          stepCount: (n) => `${n} adım`,
          minutes: (n) => `${n} dk`,
          hours: (n) => `${n} sa`,
          passive: "bekleme",
          days: (n) => `${n} gün`,
          dishes: (n) => `${n} yemek`,
          day: (n) => `${n}. gün`,
          slots: { breakfast: "Kahvaltı", lunch: "Öğle", dinner: "Akşam", snack: "Ara öğün" },
          openRecipe: "Food Planner'da aç",
          openMenu: "Food Planner'da planıma ekle",
          hint: "Uygulamada tek dokunuşla tariflerine ya da planına eklersin.",
          noApp:
            "Food Planner bu telefonda yüklü değil gibi. Uygulama yakında Google Play'de; o zamana kadar buradan okuyabilirsin.",
          goneTitle: "Bu link artık açılmıyor",
          gone: "Paylaşan kişi linki kapatmış ya da link eksik.",
          failed: "Bağlanılamadı. Biraz sonra tekrar dene.",
        },
        nl: {
          loading: "Laden…",
          sharedBy: (name) => `Gedeeld door ${name}`,
          shared: "Met je gedeeld",
          ingredients: "Ingrediënten",
          steps: "Bereiding",
          servings: (n) => `${n} personen`,
          stepCount: (n) => `${n} ${n === 1 ? "stap" : "stappen"}`,
          minutes: (n) => `${n} min`,
          hours: (n) => `${n} u`,
          passive: "wachttijd",
          days: (n) => `${n} ${n === 1 ? "dag" : "dagen"}`,
          dishes: (n) => `${n} ${n === 1 ? "gerecht" : "gerechten"}`,
          day: (n) => `Dag ${n}`,
          slots: { breakfast: "Ontbijt", lunch: "Lunch", dinner: "Avondeten", snack: "Tussendoor" },
          openRecipe: "Openen in Food Planner",
          openMenu: "In mijn planning zetten",
          hint: "In de app zet je het met één tik bij je recepten of in je planning.",
          noApp:
            "Food Planner lijkt niet op deze telefoon te staan. De app komt binnenkort in Google Play; tot dan kun je het hier lezen.",
          goneTitle: "Deze link werkt niet meer",
          gone: "Wie het deelde heeft de link gesloten, of de link is onvolledig.",
          failed: "Geen verbinding. Probeer het zo nog eens.",
        },
        en: {
          loading: "Loading…",
          sharedBy: (name) => `Shared by ${name}`,
          shared: "Shared with you",
          ingredients: "Ingredients",
          steps: "Method",
          servings: (n) => `Serves ${n}`,
          stepCount: (n) => `${n} ${n === 1 ? "step" : "steps"}`,
          minutes: (n) => `${n} min`,
          hours: (n) => `${n} h`,
          passive: "waiting",
          days: (n) => `${n} ${n === 1 ? "day" : "days"}`,
          dishes: (n) => `${n} ${n === 1 ? "dish" : "dishes"}`,
          day: (n) => `Day ${n}`,
          slots: { breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner", snack: "Snack" },
          openRecipe: "Open in Food Planner",
          openMenu: "Add to my plan in Food Planner",
          hint: "In the app it goes into your recipes or your plan in one tap.",
          noApp:
            "Food Planner doesn't seem to be on this phone. The app is coming to Google Play soon; until then you can read it here.",
          goneTitle: "This link no longer works",
          gone: "Whoever shared it closed the link, or the link is incomplete.",
          failed: "Couldn't connect. Try again in a moment.",
        },
      };

      const params = new URLSearchParams(location.search);
      const token = params.get("t") ?? "";
      const language = (navigator.language || "en").slice(0, 2);
      const s = STRINGS[language] ?? STRINGS.en;
      document.documentElement.lang = STRINGS[language] ? language : "en";

      const page = document.getElementById("page");
      const status = document.getElementById("status");

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      }

      function duration(minutes) {
        if (minutes < 60) return s.minutes(minutes);
        const hours = Math.floor(minutes / 60);
        const rest = minutes % 60;
        return rest ? `${s.hours(hours)} ${s.minutes(rest)}` : s.hours(hours);
      }

      function list(items, render) {
        const ul = el("ul", "card");
        items.forEach((item, index) => ul.append(render(item, index)));
        return ul;
      }

      function section(title, content) {
        const wrap = el("section");
        wrap.append(el("h2", null, title), content);
        return wrap;
      }

      function hero(caption, title) {
        const box = el("div", "hero");
        const text = el("div");
        text.append(el("div", "caption", caption), el("h1", null, title));
        box.append(text);
        return box;
      }

      function renderRecipe(recipe) {
        const facts = el("div", "facts");
        if (recipe.total_minutes) facts.append(el("span", "fact", duration(recipe.total_minutes)));
        facts.append(el("span", "fact", s.servings(recipe.servings)));
        if (recipe.steps.length) facts.append(el("span", "fact", s.stepCount(recipe.steps.length)));
        page.append(facts);
        if (recipe.description) page.append(el("p", "muted", recipe.description));
        if (recipe.ingredients.length) {
          page.append(
            section(
              s.ingredients,
              list(recipe.ingredients, (line) => {
                const li = el("li");
                const text = el("div", "grow", line.raw_text);
                if (line.note) text.append(el("span", "muted", ` · ${line.note}`));
                li.append(el("span", "bullet"), text);
                return li;
              }),
            ),
          );
        }
        if (recipe.steps.length) {
          page.append(
            section(
              s.steps,
              list(recipe.steps, (step, index) => {
                const li = el("li");
                const text = el("div", "grow");
                text.append(el("div", null, step.text));
                if (step.duration_min) {
                  const passive = step.kind === "passive";
                  text.append(
                    el(
                      "span",
                      passive ? "pill passive" : "pill",
                      passive
                        ? `${duration(step.duration_min)} · ${s.passive}`
                        : duration(step.duration_min),
                    ),
                  );
                }
                li.append(el("span", "number", index + 1), text);
                return li;
              }),
            ),
          );
        }
      }

      function renderMenu(payload) {
        const entries = payload.entries ?? [];
        page.append(el("p", "muted", `${s.days(payload.days ?? 1)} · ${s.dishes(entries.length)}`));
        for (let day = 0; day < (payload.days ?? 1); day++) {
          const meals = entries.filter((entry) => entry.day === day);
          if (!meals.length) continue;
          page.append(
            section(
              s.day(day + 1),
              list(meals, (meal) => {
                const li = el("li");
                li.append(
                  el("div", "grow", payload.recipes[meal.recipe]?.title ?? ""),
                  el("span", "when", `${s.slots[meal.slot] ?? ""} · ${meal.eat_at}`),
                );
                return li;
              }),
            ),
          );
        }
      }

      function showOpenButton(kind) {
        const open = document.getElementById("open");
        open.textContent = kind === "menu" ? s.openMenu : s.openRecipe;
        const appUrl = `foodplanner://share/${encodeURIComponent(token)}`;
        if (/android/i.test(navigator.userAgent)) {
          // Chrome opens the app, or comes back here with noapp=1 when it is not installed.
          const fallback = new URL(location.href);
          fallback.searchParams.set("noapp", "1");
          open.href =
            `intent://share/${encodeURIComponent(token)}#Intent;scheme=foodplanner;` +
            `package=${ANDROID_PACKAGE};S.browser_fallback_url=${encodeURIComponent(fallback.href)};end`;
        } else {
          open.href = appUrl;
        }
        document.getElementById("note").textContent = params.has("noapp") ? s.noApp : s.hint;
        document.getElementById("bar").hidden = false;
      }

      async function load() {
        status.textContent = s.loading;
        if (!/^[A-Za-z0-9]{12}$/.test(token)) {
          status.textContent = "";
          page.append(hero(s.shared, s.goneTitle), el("p", "muted", s.gone));
          return;
        }
        let share;
        try {
          const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_share`, {
            method: "POST",
            headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
            body: JSON.stringify({ share_token: token }),
          });
          if (!response.ok) throw new Error(String(response.status));
          share = await response.json();
        } catch {
          status.textContent = s.failed;
          return;
        }
        status.remove();
        if (!share) {
          page.append(hero(s.shared, s.goneTitle), el("p", "muted", s.gone));
          return;
        }
        const by = share.payload.shared_by;
        document.title = `${share.title} · Food Planner`;
        page.append(hero(by ? s.sharedBy(by) : s.shared, share.title));
        if (share.kind === "menu") renderMenu(share.payload);
        else if (share.payload.recipes[0]) renderRecipe(share.payload.recipes[0]);
        showOpenButton(share.kind);
      }

      load();
    </script>
  </body>
</html>
